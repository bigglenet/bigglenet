[package]
name = "bigglenet"
version = "0.3.2"
description = "The Biggle browser"
license = "MIT"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "bigglenet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable": more than one web view in a window (site views, see src/lib.rs).
tauri = { version = "2", features = ["unstable"] }
serde_json = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"

# The relay for games that need cross-origin isolation (src/relay.rs). Windows doesn't need it.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }

# Calls: WebKitGTK keeps the camera, microphone and WebRTC switched off unless asked.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
