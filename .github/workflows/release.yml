# Push a tag like v0.4.0 to build the desktop apps and publish them as a GitHub release.
# The tag must match the version in desktop/package.json.
#
# Run it by hand ("Run workflow" on GitHub) for a dry run: it builds everything and attaches the
# files to the run, without making a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Bigglenet $GITHUB_REF_NAME" \
            -F body=@.github/release-notes.md \
            -F draft=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # A dry run has no release to make, but still builds.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        # The Mac job builds both Apple silicon and Intel.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build tools
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y rpm

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build -w browser

      - name: Build the app
        env:
          # Signs updates so installed apps can trust them. See "Release" in the README.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run dist -w desktop

      # Smaller updates: the browser's own files, signed, for installed apps that only need those
      # (scripts/web-bundle.mjs). One system makes them for everyone.
      - name: Make the browser bundle
        if: startsWith(matrix.os, 'ubuntu')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: node scripts/web-bundle.mjs desktop/dist/release

      - name: Attach the files to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: |
          for file in desktop/dist/release/*; do
            name=$(basename "$file")
            curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" > /dev/null
            echo "Uploaded $name"
          done

      # Dry runs also start each app and check it shows the Biggle browser.
      - name: Smoke test (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y xvfb; fi
          node scripts/smoke.mjs

      - name: Keep the files (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: bigglenet-${{ matrix.os }}
          path: desktop/dist/release/*

  publish:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      # latest.json tells installed apps which version is newest and where to get it.
      - name: Write latest.json
        run: |
          node .github/scripts/latest-json.mjs "$RELEASE_ID"
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" > /dev/null

      # Only the newest version becomes "latest" (which installed apps update from), so if two
      # releases build at once and an older one finishes last, it doesn't take over.
      - name: Publish
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq "[.[] | select(.draft == false) | .tag_name] + [\"$GITHUB_REF_NAME\"] | map(ltrimstr(\"v\")) | sort_by(split(\".\") | map(tonumber)) | last")
          latest=$([ "v$newest" = "$GITHUB_REF_NAME" ] && echo true || echo false)
          echo "Newest is v$newest, so make_latest=$latest"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=$latest
